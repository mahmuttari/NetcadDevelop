org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# İMZA BİLGİSİ BURADA DURMAZ. Yerelde keystore.properties (depoya girmez), CI'da GitHub Actions
# secrets → DWG_KEYSTORE / DWG_KEYSTORE_PASSWORD / DWG_KEY_ALIAS / DWG_KEY_PASSWORD ortam değişkenleri.
# Bu dosya herkese açık depoda durduğu için hiçbir gizli değer yazılmaz.

# Google ile giriş / Drive: Google Cloud Console → Credentials → OAuth client ID → Android
#   paket adı: com.mahmuttari.dwgviewer   yükleme anahtarı SHA-1: F9:10:2B:55:C8:62:6A:39:4A:44:FA:75:3F:09:5C:5D:BD:B6:36:B6
#   Play App Signing açıldıktan sonra Google'ın gördüğü parmak izi Play'in kendi sertifikasıdır
#   (Play Console → Uygulama bütünlüğü); o SHA-1 de OAuth istemcisine eklenir.
# Örnek: GOOGLE_CLIENT_ID=123456789012-abcdefghijklmnop.apps.googleusercontent.com
GOOGLE_CLIENT_ID=805912866704-bll07afn7ghu2nl99gkfut8vq5gnc556.apps.googleusercontent.com

# AdMob (Pro yetkisi olmayan kullanıcıya geçiş reklamı). Gerçek kimlikler AdMob konsolundan (Uygulamalar → Uygulama ayarları → Uygulama kimliği;
# Reklam birimleri → Geçiş reklamı → Reklam birimi kimliği) alınıp buraya yazılır. Boş bırakılırsa Google'ın TEST
# kimlikleri kullanılır: test kimlikleriyle yayımlanan uygulama reklam gösterir ama gerçek gelir ÜRETMEZ.
ADMOB_APP_ID=ca-app-pub-2417242373034448~5327313404
ADMOB_INTERSTITIAL_ID=ca-app-pub-2417242373034448/9362761334

# Abonelikler: Play Console → Para kazanma → Abonelikler. Üç ürün, her birinde iki temel plan
# (aylık ve yıllık). Yetki, sahip olunan aboneliklerin EN YÜKSEĞİdir: adfree < premium < super.
#   dwg_adfree   reklamsız (çizim ve düzenleme yok)
#   dwg_premium  reklamsız + 2B çizim/düzenleme + belge düzenleme + yeni dosya
#   dwg_super    hepsi + 3B, kot profili, karşılaştırma, delta kaydı, Drive'a yükleme
SKU_ADFREE=dwg_adfree
SKU_PREMIUM=dwg_premium
SKU_SUPER=dwg_super
# Temel plan kimlikleri (her üç abonelikte de aynı yazılır)
PLAN_MONTHLY=monthly
PLAN_YEARLY=yearly
# Çevrimdışı lisans kodu için RSA-2048 açık anahtar (Base64, X.509 SubjectPublicKeyInfo). Üretimi:
#   node tools/license_gen.mjs keygen --out keystore/license_private.pem   (açık anahtar stdout'a basılır, buraya yapıştırılır)
#   node tools/license_gen.mjs sign --key keystore/license_private.pem --name "Ad Soyad" [--expires 2027-12-31]
# Özel anahtar (keystore/license_private.pem) depoya girmez (.gitignore). Boş bırakılırsa lisans kodu özelliği kapalıdır.
LICENSE_PUBLIC_KEY=
