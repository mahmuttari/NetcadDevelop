plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

// Derleme kimliği: git dalı ve kısa commit numarası. Git kökü DwgViewer'ın üstündedir; git
// bulunamazsa ya da komut başarısız olursa derleme bozulmaz, 'main' ve 'yok' kullanılır.
def gitOut = { List<String> cmd, String fallback ->
    try {
        def p = new ProcessBuilder(cmd).directory(rootProject.projectDir).redirectErrorStream(true).start()
        def txt = p.inputStream.text.trim()
        p.waitFor()
        return (p.exitValue() == 0 && txt) ? txt : fallback
    } catch (Exception ignored) {
        return fallback
    }
}
def gitBranch = gitOut(["git", "rev-parse", "--abbrev-ref", "HEAD"], "")
if (!gitBranch || gitBranch == "HEAD") {
    // CI'da çıkış çoğunlukla ayrık HEAD'dir; dal adı ortam değişkenlerinden alınır
    gitBranch = System.getenv("GITHUB_HEAD_REF") ?: System.getenv("GITHUB_REF_NAME") ?: "main"
}
def gitSha = gitOut(["git", "rev-parse", "--short", "HEAD"], "yok")

/*
 * İmza bilgileri DEPODA DURMAZ. Sıra: ortam değişkeni (CI secrets) → keystore.properties (yerel, .gitignore'da)
 * → -P proje özelliği. Hiçbiri yoksa release imzasız derlenir; derleme kırılmaz ama çıktı Play'e yüklenemez.
 * Bir anahtar herkese açık bir yere düştüğü an yakılmış sayılır: 2026-09-14'te eski anahtar (SHA-1 24:D2:…)
 * bu yüzden bırakıldı, yerine dwgviewer-upload alındı.
 */
def ksProps = new Properties()
def ksPropsFile = rootProject.file("keystore.properties")
if (ksPropsFile.exists()) ksPropsFile.withInputStream { ksProps.load(it) }
def signVal = { String env, String key ->
    def v = System.getenv(env) ?: ksProps.getProperty(key) ?: project.findProperty(env)
    return v == null ? null : v.toString().trim() ?: null
}
def ksPath = signVal("DWG_KEYSTORE", "storeFile")
def ksPass = signVal("DWG_KEYSTORE_PASSWORD", "storePassword")
def ksAlias = signVal("DWG_KEY_ALIAS", "keyAlias")
def ksKeyPass = signVal("DWG_KEY_PASSWORD", "keyPassword")
def canSign = ksPath && ksPass && ksAlias && ksKeyPass && rootProject.file(ksPath).exists()
if (!canSign) logger.lifecycle("UYARI: imza bilgisi yok, release İMZASIZ derlenecek (keystore.properties ya da DWG_* ortam değişkenleri).")

android {
    namespace "com.mahmuttari.dwgviewer"
    compileSdk 34

    defaultConfig {
        applicationId "com.mahmuttari.dwgviewer"
        minSdk 26
        targetSdk 34
        versionCode 117
        versionName "7.94"

        // Uygulamanın taşıdığı diller. Listede olmayan bir dilde kurulan cihaz İngilizce'ye düşer;
        // bağımlılıkların (AndroidX, Play) 85 dilde etiketi APK'ye girmez. Yeni dil eklerken bu liste,
        // res/values-<kod>/strings.xml, res/xml/locales_config.xml ve viewer/lang/<kod>.js birlikte güncellenir.
        resourceConfigurations += ["tr", "en", "ar", "de", "es", "fr", "hi", "in", "it", "ja", "ko", "pt", "ru", "vi", "zh"]

        // Derleme kimliği hata kaydında görünür; sürüm denetimi derlendiği daldaki version.json'a bakar
        buildConfigField "String", "GIT_SHA", "\"" + gitSha + "\""
        buildConfigField "String", "UPDATE_URL", "\"https://raw.githubusercontent.com/mahmuttari/NetcadDevelop/" + gitBranch + "/DwgViewer/release/version.json\""

        // Google ile giriş: gradle.properties → GOOGLE_CLIENT_ID (Android türü OAuth istemcisi).
        // Yönlendirme şeması istemci numarasından türetilir: com.googleusercontent.apps.<no>
        def gcid = (project.findProperty("GOOGLE_CLIENT_ID") ?: "").toString().trim()
        def gscheme = gcid ? "com.googleusercontent.apps." + gcid.split("\\.")[0] : "com.mahmuttari.dwgviewer.oauth"
        buildConfigField "String", "GOOGLE_CLIENT_ID", "\"" + gcid + "\""
        buildConfigField "String", "GOOGLE_REDIRECT_SCHEME", "\"" + gscheme + "\""

        // AdMob kimlikleri gradle.properties'ten (boşsa Google'ın test kimlikleri; gerçek gelir üretmez). Reklam yalnız
        // Pro yetkisi olmayan kullanıcıya gösterilir; SDK her derlemede vardır, Pro'da başlatılmaz.
        def admobApp = (project.findProperty("ADMOB_APP_ID") ?: "").toString().trim() ?: "ca-app-pub-3940256099942544~3347511713"
        def admobInt = (project.findProperty("ADMOB_INTERSTITIAL_ID") ?: "").toString().trim() ?: "ca-app-pub-3940256099942544/1033173712"
        buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"" + admobInt + "\""
        manifestPlaceholders = [googleRedirectScheme: gscheme, admobAppId: admobApp]

        // Yetki çalışma zamanında: üç Google Play aboneliği (adfree < premium < super) ya da çevrimdışı lisans kodu.
        // Her abonelikte iki temel plan vardır (aylık, yıllık); kimlikleri Play Console'daki yazımla birebir aynı olmalı.
        // LICENSE_PUBLIC_KEY: RSA-2048 açık anahtar, Base64 X.509 SubjectPublicKeyInfo (tools/license_gen.mjs keygen);
        // boşsa lisans kodu özelliği kapalıdır.
        def sku = { String k, String d -> (project.findProperty(k) ?: "").toString().trim() ?: d }
        def licPub = (project.findProperty("LICENSE_PUBLIC_KEY") ?: "").toString().replaceAll("\\s", "")
        buildConfigField "String", "SKU_ADFREE", "\"" + sku("SKU_ADFREE", "dwg_adfree") + "\""
        buildConfigField "String", "SKU_PREMIUM", "\"" + sku("SKU_PREMIUM", "dwg_premium") + "\""
        buildConfigField "String", "SKU_SUPER", "\"" + sku("SKU_SUPER", "dwg_super") + "\""
        buildConfigField "String", "PLAN_MONTHLY", "\"" + sku("PLAN_MONTHLY", "monthly") + "\""
        buildConfigField "String", "PLAN_YEARLY", "\"" + sku("PLAN_YEARLY", "yearly") + "\""
        buildConfigField "String", "LICENSE_PUBLIC_KEY", "\"" + licPub + "\""
    }

    signingConfigs {
        release {
            if (canSign) {
                storeFile rootProject.file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            // R8: kullanılmayan androidx/kotlinx sınıfları düşer; JS köprüsü ve junrar proguard-rules.pro ile korunur
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig canSign ? signingConfigs.release : null
            // AGP'nin sürüm-kontrol damgası git kökünü bulamaz (NO_SUPPORTED_VCS_FOUND); kimlik GIT_SHA ile gömülür
            vcsInfo {
                include false
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    kotlinOptions { jvmTarget = "17" }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // Varsayılan kalıplar korunur; assets içindeki .md dosyaları (lib/NOTICE.md) APK'ya girmez
        ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.md"
    }

    // .wasm dosyası APK içinde sıkıştırılmış kalır (yaklaşık 10 MB -> 3 MB);
    // AssetManager açarken kendisi açar.
    packaging {
        resources.excludes += ["META-INF/*", "kotlin/**", "DebugProbesKt.bin"]
    }
}

dependencies {
    // Yalnız FileProvider için (PDF/PNG paylaşımı, Android 8-9'da dosya URI'si)
    implementation "androidx.core:core:1.13.1"
    // RAR arşivleri (RAR 2/3/4; RAR5 desteklenmez) — MIT lisanslı
    implementation "com.github.junrar:junrar:7.5.5"
    // AdMob geçiş reklamı ve UMP rıza formu (yalnız Pro yetkisi olmayan kullanıcıya gösterilir)
    implementation "com.google.android.gms:play-services-ads:23.6.0"
    // Google Play Faturalandırma: Pro uygulama içi satın alma (tek seferlik, tüketilmeyen ürün)
    implementation "com.android.billingclient:billing:7.1.1"
    // Jetpack Compose — YALNIZ çizim açılış ekranı için. Başvuru sahibinin gönderdiği ekran
    // (app/src/main/java/com/example/dwgloader/MainActivity.kt) tek satırı değiştirilmeden
    // derlenir; uygulamanın geri kalanı WebView'dır. ComposeView bir ComponentActivity ister,
    // bu yüzden MainActivity android.app.Activity yerine androidx.activity.ComponentActivity'yi
    // genişletir.
    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.9.3"
}
