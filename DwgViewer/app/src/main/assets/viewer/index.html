<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DWG Görüntüleyici</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btnOpen" class="btn primary" data-i18n-title="open">📂 <span data-i18n="open">Aç</span></button>
    <div id="fileName" class="filename">Dosya seçilmedi</div>
    <button id="btnSearch" class="btn icon" data-i18n-title="search">🔍</button>
    <button id="btnExtents" class="btn icon" data-i18n-title="fit">⤢</button>
    <button id="btnLayers" class="btn icon" data-i18n-title="layers">☰</button>
    <button id="btnMeasure" class="btn icon" data-i18n-title="measure">📏</button>
    <button id="btnMore" class="btn icon" data-i18n-title="more">⋮</button>
  </header>
  <div id="layoutTabs" class="tabs" hidden></div>

  <div id="main">
    <div id="viewport">
      <canvas id="cv"></canvas>
      <canvas id="ov"></canvas>
      <div id="gpsBtn" class="fab" hidden title="GPS">🧭</div>
      <div id="empty" class="empty">
        <div class="empty-card">
          <div class="empty-logo">DWG</div>
          <h1 data-i18n="welcomeTitle">DWG Görüntüleyici</h1>
          <p data-i18n="welcomeText"></p>
          <button id="btnOpen2" class="btn primary big" data-i18n="pickFile">📂 DWG / DXF dosyası seç</button>
          <input id="fileInput" type="file" accept=".dwg,.dxf,application/acad,application/x-dwg,application/dxf,application/octet-stream" hidden>
          <div class="row">
            <button id="btnServer" class="btn small" data-i18n="server">Sunucudan indir</button>
            <button id="btnQr" class="btn small" data-i18n="qr">QR okut</button>
          </div>
          <div id="recentWrap" hidden>
            <h3 data-i18n="recent">Son dosyalar</h3>
            <div id="recentList" class="recent"></div>
          </div>
          <p class="hint" data-i18n="hint"></p>
        </div>
      </div>
      <div id="notesBar" class="notesbar" hidden>
        <button data-tool="select" class="active" data-i18n-title="select">👆</button>
        <button data-tool="pen" data-i18n-title="pen">✏️</button>
        <button data-tool="line" data-i18n-title="line">╱</button>
        <button data-tool="arrow" data-i18n-title="arrow">➜</button>
        <button data-tool="rect" data-i18n-title="rect">▭</button>
        <button data-tool="circle" data-i18n-title="circle">◯</button>
        <button data-tool="text" data-i18n-title="noteText">T</button>
        <button data-tool="photo" data-i18n-title="photo">📷</button>
        <input type="color" id="noteColor" value="#ff3b30" data-i18n-title="noteColor">
        <button id="noteUndo" data-i18n-title="undo">↶</button>
        <button id="noteDelete" data-i18n-title="delete">🗑</button>
        <button id="noteClose" data-i18n-title="close">✕</button>
      </div>
    </div>
    <aside id="side" class="side" hidden></aside>
  </div>

  <footer id="statusbar">
    <span id="stCoord" title="Kopyalamak için dokunun">X: – &nbsp; Y: –</span>
    <span id="stScale"></span>
    <span id="stGps" hidden>●</span>
    <span id="stCount"></span>
  </footer>

  <div id="loading" class="modal" hidden>
    <div class="spinner"></div>
    <div id="loadingText">Yükleniyor…</div>
    <div id="loadingSub" class="sub"></div>
  </div>

  <!-- Katmanlar -->
  <aside id="layerPanel" class="panel right" hidden>
    <div class="panel-head">
      <strong data-i18n="layers">Katmanlar</strong>
      <span id="layerCount" class="muted"></span>
      <button class="btn small" id="btnLayersAll" data-i18n="layersAll">Tümü</button>
      <button class="btn small" id="btnLayersNone" data-i18n="layersNone">Hiçbiri</button>
      <button class="btn icon close" data-close="layerPanel">✕</button>
    </div>
    <input id="layerFilter" type="search" data-i18n-ph="layerFilter" placeholder="Katman ara…">
    <div id="layerList" class="panel-body"></div>
  </aside>

  <!-- Nesne bilgisi -->
  <aside id="infoPanel" class="panel bottom" hidden>
    <div class="panel-head">
      <strong id="infoTitle">Nesne</strong>
      <button class="btn small" id="infoZoom" data-i18n="zoomTo">Yakınlaştır</button>
      <button class="btn small" id="infoCopy" data-i18n="copyCoord">Koordinatı kopyala</button>
      <button class="btn icon close" data-close="infoPanel">✕</button>
    </div>
    <div id="infoBody" class="panel-body kv"></div>
  </aside>

  <!-- Ölçü / profil -->
  <aside id="measurePanel" class="panel bottom" hidden>
    <div class="panel-head">
      <strong id="measureTitle" data-i18n="measure">Ölçü</strong>
      <span class="muted" id="measureHint" data-i18n="measureHint"></span>
      <button class="btn small" id="btnMeasureUndo" data-i18n="undo">Geri al</button>
      <button class="btn small" id="btnMeasureClear" data-i18n="clear">Temizle</button>
      <button class="btn icon close" id="btnMeasureClose">✕</button>
    </div>
    <div id="snapBar" class="snapbar">
      <label><input type="checkbox" data-snap="end" checked>END</label>
      <label><input type="checkbox" data-snap="mid" checked>MID</label>
      <label><input type="checkbox" data-snap="cen" checked>CEN</label>
      <label><input type="checkbox" data-snap="int" checked>INT</label>
      <label><input type="checkbox" data-snap="per">PER</label>
      <label><input type="checkbox" data-snap="nea">NEA</label>
      <label><input type="checkbox" data-snap="ins" checked>INS</label>
      <label><input type="checkbox" data-snap="node" checked>NOD</label>
    </div>
    <div id="measureBody" class="panel-body kv"></div>
  </aside>

  <!-- Arama -->
  <aside id="searchPanel" class="panel bottom" hidden>
    <div class="panel-head">
      <input id="searchInput" type="search" data-i18n-ph="searchPh" placeholder="Yazı, katman, blok, öznitelik, handle…">
      <button class="btn icon close" data-close="searchPanel">✕</button>
    </div>
    <div id="searchBody" class="panel-body list"></div>
  </aside>

  <!-- Genel amaçlı belge paneli (çizim bilgisi, hakkında, kayıtlı görünümler, sunucu, xref, karşılaştırma, ayarlar…) -->
  <aside id="docPanel" class="panel bottom" hidden>
    <div class="panel-head">
      <strong id="docTitle"></strong>
      <button class="btn icon close" data-close="docPanel">✕</button>
    </div>
    <div id="docBody" class="panel-body kv"></div>
  </aside>

  <!-- Diğer menüsü -->
  <div id="moreMenu" class="menu" hidden>
    <button data-act="info">ℹ️ <span data-i18n="info">Çizim bilgisi</span></button>
    <button data-act="layouts">📄 <span data-i18n="layouts">Sayfa düzenleri</span></button>
    <button data-act="notes">✏️ <span data-i18n="notes">Notlar (redline)</span></button>
    <button data-act="profile">📈 <span data-i18n="profile">Profil / eğim</span></button>
    <button data-act="gps">🧭 <span data-i18n="gps">GPS konumu</span></button>
    <button data-act="basemap">🗺️ <span data-i18n="basemap">Harita altlığı</span></button>
    <button data-act="compare">🔀 <span data-i18n="compare">Revizyon karşılaştır</span></button>
    <button data-act="xrefs">🔗 <span data-i18n="xrefs">Referans dosyaları</span></button>
    <button data-act="views">🔖 <span data-i18n="views">Kayıtlı görünümler</span></button>
    <button data-act="bg">🌓 <span data-i18n="bg">Arka plan: koyu / açık</span></button>
    <button data-act="mono">🎨 <span data-i18n="mono">Tek renk / renkli</span></button>
    <button data-act="lw">〰️ <span data-i18n="lw">Çizgi kalınlıkları</span></button>
    <button data-act="text">🔤 <span data-i18n="text">Yazıları göster / gizle</span></button>
    <button data-act="png">🖼️ <span data-i18n="png">Görünümü PNG kaydet</span></button>
    <button data-act="pdf">📑 <span data-i18n="pdf">PDF oluştur</span></button>
    <button data-act="server">☁️ <span data-i18n="server">Sunucudan indir</span></button>
    <button data-act="qr">▦ <span data-i18n="qr">QR okut</span></button>
    <button data-act="settings">⚙️ <span data-i18n="settings">Ayarlar</span></button>
    <button data-act="about">📄 <span data-i18n="about">Hakkında</span></button>
  </div>

  <!-- QR tarayıcı -->
  <div id="qrPanel" class="modal" hidden>
    <video id="qrVideo" playsinline autoplay muted></video>
    <div class="sub" data-i18n="qrHint">QR kodu kameraya gösterin</div>
    <button class="btn" id="qrStop" data-i18n="qrStop">Durdur</button>
  </div>

  <div id="toast" class="toast" hidden></div>
</div>
<script src="lib/jsQR.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
