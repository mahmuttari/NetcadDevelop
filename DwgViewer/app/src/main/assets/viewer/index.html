<div id="app">
  <header id="topbar">
    <button id="btnOpen" class="btn primary" data-i18n-title="open" type="button"><svg class="ic" aria-hidden="true"><use href="#i-open"/></svg><span data-i18n="open">Aç</span></button>
    <div class="filewrap"><div id="fileName" class="filename">Dosya seçilmedi</div><div id="fileSub" class="filesub"></div></div>
    <button id="btnSearch" class="btn icon" data-i18n-title="search" type="button" aria-label="Ara"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></button>
    <button id="btnExtents" class="btn icon" data-i18n-title="fit" type="button" aria-label="Sığdır"><svg class="ic" aria-hidden="true"><use href="#i-fit"/></svg></button>
    <button id="btnLayers" class="btn icon" data-i18n-title="layers" type="button" aria-label="Katmanlar"><svg class="ic" aria-hidden="true"><use href="#i-layers"/></svg></button>
    <button id="btnMeasure" class="btn icon" data-i18n-title="measure" type="button" aria-label="Ölçü"><svg class="ic" aria-hidden="true"><use href="#i-dist"/></svg></button>
    <button id="btnDisplay" class="btn icon" data-i18n-title="dispTitle" type="button" aria-label="Ekran ayarları"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg></button>
    <button id="btnMore" class="btn icon" data-i18n-title="more" type="button" aria-label="Diğer"><svg class="ic" aria-hidden="true"><use href="#i-more"/></svg></button>
  </header>
  <div id="layoutTabs" class="tabs" hidden></div>

  <div id="main">
    <div id="viewport">
      <canvas id="cv"></canvas>
      <canvas id="cv3d" hidden></canvas>
      <canvas id="ov"></canvas>
      <div id="gpsBtn" class="fab" hidden title="GPS" role="button" aria-label="GPS"><svg class="ic" aria-hidden="true"><use href="#i-gps"/></svg></div>
      <div id="cube3d" class="hud cube" hidden></div>
      <div id="empty" class="empty">
        <div class="empty-card">
          <div class="empty-logo">DWG</div>
          <h1 data-i18n="welcomeTitle">DWG Görüntüleyici</h1>
          <p data-i18n="welcomeText"></p>
          <button id="btnOpen2" class="btn primary big" data-i18n="pickFile" type="button">📂 DWG / DXF dosyası seç</button>
          <input id="fileInput" type="file" accept=".dwg,.dxf,.pdf,.docx,.doc,.xlsx,.zip,.rar,.png,.jpg,.jpeg,.txt,.csv,application/acad,application/x-dwg,application/dxf,application/pdf,application/zip,application/octet-stream" hidden>
          <div class="row">
            <button id="btnServer" class="btn small" data-i18n="server" type="button">Sunucudan indir</button>
            <button id="btnQr" class="btn small" data-i18n="qr" type="button">QR okut</button>
            <button id="btnDrive" class="btn small" type="button"><svg class="ic" aria-hidden="true"><use href="#i-map"/></svg><span data-i18n="drive">Google Drive</span></button>
          </div>
          <div id="recentWrap" hidden>
            <h3 data-i18n="recent">Son dosyalar</h3>
            <div id="recentList" class="recent"></div>
          </div>
          <p class="hint" data-i18n="hint"></p>
        </div>
      </div>
      <div id="cmdBar" class="cmdbar" hidden>
        <span id="cmdText"></span>
        <span class="cmd-in"><input id="cmdInput" type="text" placeholder="x,y | @dx,dy | @L<açı" autocomplete="off" inputmode="text"><button id="cmdEnter" type="button" aria-label="Gir">↵</button></span>
        <span id="cmdBtns"></span>
      </div>
      <div id="docView" class="docview" hidden>
        <div class="doc-head">
          <button type="button" class="btn icon" data-doc="back" hidden aria-label="Geri"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
          <div class="doc-title"><strong id="docName"></strong><small id="docMeta"></small></div>
          <div class="doc-acts" id="docActs"></div>
          <button type="button" class="btn icon" data-doc="close" aria-label="Kapat"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
        </div>
        <div class="doc-tools" id="docTools"></div>
        <div class="doc-body" id="docContent"></div>
      </div>
      <div id="notesBar" class="notesbar" hidden>
        <button data-tool="select" class="active" data-i18n-title="select" type="button">👆</button>
        <button data-tool="pen" data-i18n-title="pen" type="button">✏️</button>
        <button data-tool="line" data-i18n-title="line" type="button">╱</button>
        <button data-tool="arrow" data-i18n-title="arrow" type="button">➜</button>
        <button data-tool="rect" data-i18n-title="rect" type="button">▭</button>
        <button data-tool="circle" data-i18n-title="circle" type="button">◯</button>
        <button data-tool="text" data-i18n-title="noteText" type="button">T</button>
        <button data-tool="photo" data-i18n-title="photo" type="button">📷</button>
        <input type="color" id="noteColor" value="#ff3b30" data-i18n-title="noteColor">
        <button id="noteUndo" data-i18n-title="undo" type="button">↶</button>
        <button id="noteDelete" data-i18n-title="delete" type="button">🗑</button>
        <button id="noteClose" data-i18n-title="close" type="button">✕</button>
      </div>
      <div id="tour" class="hud tour" hidden role="dialog" aria-live="polite">
        <div class="tour-card">
          <strong id="tourTitle" data-i18n="tourTitle">Hoş geldiniz</strong>
          <p id="tourText"></p>
          <div class="tour-dots" id="tourDots"></div>
          <div class="row">
            <button type="button" class="btn small" id="tourSkip" data-i18n="tourSkip">Atla</button>
            <button type="button" class="btn primary small" id="tourNext" data-i18n="tourNext">İleri</button>
          </div>
        </div>
      </div>
    </div>
    <aside id="side" class="side" hidden>
      <div class="side-tabs" id="sideTabs">
        <button type="button" data-side="layers" class="on" data-i18n="sideLayers">Katmanlar</button>
        <button type="button" data-side="display" data-i18n="sideDisplay">Ekran</button>
      </div>
    </aside>
  </div>

  <nav id="toolbar" aria-label="Araç çubuğu"></nav>
  <footer id="statusbar">
    <div id="stQuick" class="st-quick">
      <button type="button" data-quick="grid" data-i18n-title="stQuickGrid" aria-label="Izgara" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg></button>
      <button type="button" data-quick="lw" data-i18n-title="stQuickLw" aria-label="Çizgi kalınlığı" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-lw"/></svg></button>
      <button type="button" data-quick="text" data-i18n-title="stQuickText" aria-label="Yazı" aria-pressed="true"><svg class="ic" aria-hidden="true"><use href="#i-text"/></svg></button>
      <button type="button" data-quick="osnap" data-i18n-title="stQuickOsnap" aria-label="Nesne yakalama" aria-pressed="true"><svg class="ic" aria-hidden="true"><use href="#i-snap"/></svg></button>
    </div>
    <span id="stCoord" title="Kopyalamak için dokunun">X: – &nbsp; Y: –</span>
    <span id="stSnap" class="st-chip" hidden></span>
    <span id="stGrid" class="st-chip" hidden></span>
    <button id="stScale" class="st-chip" type="button"></button>
    <span id="stMode" class="st-chip st-mode" hidden></span>
    <span id="stGps" hidden>●</span>
    <span id="stCount"></span>
  </footer>

  <div id="loading" class="modal" hidden>
    <div class="spinner"></div>
    <div id="loadingText">Yükleniyor…</div>
    <div id="loadingSub" class="sub"></div>
  </div>

  <!-- Katmanlar -->
  <aside id="layerPanel" class="panel right" hidden>
    <div class="panel-head">
      <strong data-i18n="layers">Katmanlar</strong>
      <span id="layerCount" class="muted"></span>
      <button class="btn small" id="btnLayersAll" data-i18n="layersAll" type="button">Tümü</button>
      <button class="btn small" id="btnLayersNone" data-i18n="layersNone" type="button">Hiçbiri</button>
      <button class="btn small" id="btnLayersInvert" data-i18n="layersInvert" type="button">Ters çevir</button>
      <button class="btn small accent" id="btnLayersUniso" data-i18n="layersUniso" type="button" hidden>İzolasyonu kaldır</button>
      <button class="btn icon close" data-close="layerPanel" type="button" aria-label="Kapat"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="layer-tools">
      <input id="layerFilter" type="search" data-i18n-ph="layerFilter" placeholder="Katman ara…">
      <select id="layerSort" aria-label="Sıralama"><option value="name" data-i18n="sortName">Ada göre</option><option value="count" data-i18n="sortCount">Sayıya göre</option></select>
      <label id="layerOnlyVis" class="chk"><input type="checkbox"> <span data-i18n="onlyVis">Yalnız görünenler</span></label>
    </div>
    <div id="layerList" class="panel-body"></div>
  </aside>

  <!-- Nesne bilgisi -->
  <aside id="infoPanel" class="panel bottom" hidden>
    <div class="panel-head">
      <strong id="infoTitle">Nesne</strong>
      <button class="btn small" id="infoZoom" data-i18n="zoomTo" type="button">Yakınlaştır</button>
      <button class="btn small" id="infoCopy" data-i18n="copyCoord" type="button">Koordinatı kopyala</button>
      <button class="btn icon close" data-close="infoPanel" type="button" aria-label="Kapat"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div id="infoBody" class="panel-body kv"></div>
  </aside>

  <!-- Ölçü / profil -->
  <aside id="measurePanel" class="panel bottom" hidden>
    <div class="panel-head">
      <strong id="measureTitle" data-i18n="measure">Ölçü</strong>
      <span class="muted" id="measureHint" data-i18n="measureHint"></span>
      <button class="btn small" id="btnMeasureUndo" data-i18n="undo" type="button">Geri al</button>
      <button class="btn small" id="btnMeasureClear" data-i18n="clear" type="button">Temizle</button>
      <button class="btn icon close" id="btnMeasureClose" type="button" aria-label="Kapat"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div id="snapBar" class="snapbar">
      <label><input type="checkbox" data-snap="end" checked>END</label>
      <label><input type="checkbox" data-snap="mid" checked>MID</label>
      <label><input type="checkbox" data-snap="cen" checked>CEN</label>
      <label><input type="checkbox" data-snap="int" checked>INT</label>
      <label><input type="checkbox" data-snap="per">PER</label>
      <label><input type="checkbox" data-snap="nea">NEA</label>
      <label><input type="checkbox" data-snap="ins" checked>INS</label>
      <label><input type="checkbox" data-snap="node" checked>NOD</label>
    </div>
    <div id="measureBody" class="panel-body kv"></div>
  </aside>

  <!-- Arama -->
  <aside id="searchPanel" class="panel bottom" hidden>
    <div class="panel-head">
      <input id="searchInput" type="search" data-i18n-ph="searchPh" placeholder="Yazı, katman, blok, öznitelik, handle…">
      <button class="btn icon close" data-close="searchPanel" type="button" aria-label="Kapat"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div id="searchBody" class="panel-body list"></div>
  </aside>

  <!-- Genel amaçlı belge paneli (çizim bilgisi, hakkında, kayıtlı görünümler, sunucu, xref, karşılaştırma, ayarlar…) -->
  <aside id="docPanel" class="panel bottom" hidden>
    <div class="panel-head">
      <strong id="docTitle"></strong>
      <button class="btn icon close" data-close="docPanel" type="button" aria-label="Kapat"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div id="docBody" class="panel-body kv"></div>
  </aside>

  <!-- Ekran ayarları (2B / 3B) -->
  <aside id="displayPanel" class="panel bottom" hidden role="dialog" aria-labelledby="displayTitle">
    <div class="panel-head">
      <div id="displaySeg" class="seg"><button type="button" data-seg="2d" class="on">2B</button><button type="button" data-seg="3d">3B</button></div>
      <strong id="displayTitle" data-i18n="dispTitle">Ekran ayarları</strong>
      <button type="button" class="btn small" id="displayReset" data-i18n="dispReset">Sıfırla</button>
      <button type="button" class="btn icon close" data-close="displayPanel" aria-label="Kapat"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div id="displayBody" class="panel-body"></div>
  </aside>

  <!-- Google Drive -->
  <aside id="drivePanel" class="panel bottom" hidden role="dialog">
    <div class="panel-head">
      <strong><svg class="ic" aria-hidden="true"><use href="#i-map"/></svg> Google Drive</strong>
      <div id="driveAccount" class="drive-account"></div>
      <button type="button" class="btn icon" data-drive="upload" data-i18n-title="driveUpload" aria-label="Drive'a yükle"><svg class="ic" aria-hidden="true"><use href="#i-export"/></svg></button>
      <button type="button" class="btn icon" data-drive="mkdir" data-i18n-title="newFolder" aria-label="Yeni klasör"><svg class="ic" aria-hidden="true"><use href="#i-open"/></svg></button>
      <button type="button" class="btn icon" data-drive="refresh" data-i18n-title="refresh" aria-label="Yenile"><svg class="ic" aria-hidden="true"><use href="#i-turn"/></svg></button>
      <button type="button" class="btn icon close" data-close="drivePanel" aria-label="Kapat"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="drive-tools"><input id="driveSearch" type="search" data-i18n-ph="driveSearchPh" placeholder="Drive'da ara…"></div>
    <div id="driveCrumbs" class="drive-crumbs"></div>
    <div id="driveList" class="panel-body"></div>
  </aside>

  <!-- Diğer menüsü -->
  <div id="moreMenu" class="menu" hidden>
    <button data-act="info" type="button"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg><span data-i18n="info">Çizim bilgisi</span></button>
    <button data-act="drive" type="button"><svg class="ic" aria-hidden="true"><use href="#i-map"/></svg><span data-i18n="drive">Google Drive</span></button>
    <button data-act="layouts" type="button"><svg class="ic" aria-hidden="true"><use href="#i-layout"/></svg><span data-i18n="layouts">Sayfa düzenleri</span></button>
    <button data-act="notes" type="button"><svg class="ic" aria-hidden="true"><use href="#i-pen"/></svg><span data-i18n="notes">Notlar (redline)</span></button>
    <button data-act="profile" type="button"><svg class="ic" aria-hidden="true"><use href="#i-profile"/></svg><span data-i18n="profile">Profil / eğim</span></button>
    <button data-act="gps" type="button"><svg class="ic" aria-hidden="true"><use href="#i-gps"/></svg><span data-i18n="gps">GPS konumu</span></button>
    <button data-act="basemap" type="button"><svg class="ic" aria-hidden="true"><use href="#i-map"/></svg><span data-i18n="basemap">Harita altlığı</span></button>
    <button data-act="compare" type="button"><svg class="ic" aria-hidden="true"><use href="#i-compare"/></svg><span data-i18n="compare">Revizyon karşılaştır</span></button>
    <button data-act="xrefs" type="button"><svg class="ic" aria-hidden="true"><use href="#i-export"/></svg><span data-i18n="xrefs">Referans dosyaları</span></button>
    <button data-act="views" type="button"><svg class="ic" aria-hidden="true"><use href="#i-bookmark"/></svg><span data-i18n="views">Kayıtlı görünümler</span></button>
    <button data-act="display" type="button"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg><span data-i18n="dispTitle">Ekran ayarları</span></button>
    <button data-act="bg" type="button"><svg class="ic" aria-hidden="true"><use href="#i-theme"/></svg><span data-i18n="bg">Arka plan: koyu / açık</span></button>
    <button data-act="mono" type="button"><svg class="ic" aria-hidden="true"><use href="#i-mono"/></svg><span data-i18n="mono">Tek renk / renkli</span></button>
    <button data-act="lw" type="button"><svg class="ic" aria-hidden="true"><use href="#i-lw"/></svg><span data-i18n="lw">Çizgi kalınlıkları</span></button>
    <button data-act="text" type="button"><svg class="ic" aria-hidden="true"><use href="#i-text"/></svg><span data-i18n="text">Yazıları göster / gizle</span></button>
    <button data-act="png" type="button"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg><span data-i18n="png">Görünümü PNG kaydet</span></button>
    <button data-act="pdf" type="button"><svg class="ic" aria-hidden="true"><use href="#i-pdf"/></svg><span data-i18n="pdf">PDF oluştur</span></button>
    <button data-act="server" type="button"><svg class="ic" aria-hidden="true"><use href="#i-export"/></svg><span data-i18n="server">Sunucudan indir</span></button>
    <button data-act="qr" type="button"><svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg><span data-i18n="qr">QR okut</span></button>
    <button data-act="settings" type="button"><svg class="ic" aria-hidden="true"><use href="#i-props"/></svg><span data-i18n="settings">Ayarlar</span></button>
    <button data-act="about" type="button"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg><span data-i18n="about">Hakkında</span></button>
  </div>

  <!-- Araç çubuğu açılır kutusu (uzun basış ipucu, sık kullanılan, 3B seçenek bölümleri) -->
  <div id="tbPop" class="tb-pop hud" hidden role="dialog"></div>

  <!-- QR tarayıcı -->
  <div id="qrPanel" class="modal" hidden>
    <video id="qrVideo" playsinline autoplay muted></video>
    <div class="sub" data-i18n="qrHint">QR kodu kameraya gösterin</div>
    <button class="btn" id="qrStop" data-i18n="qrStop" type="button">Durdur</button>
  </div>

  <div id="toast" class="toast" hidden aria-live="polite"><span class="tx"></span><button class="act" type="button" hidden></button></div>
</div>
<script src="lib/jsQR.js"></script>
<script type="module" src="app.js"></script>
</body>
