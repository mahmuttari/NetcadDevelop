    <!--
      Sohbete gönderme simgesi. Bilerek WhatsApp'ın kendi işareti DEĞİLDİR: onların markası
      yeşil balonun içindeki telefon ahizesidir ve kopyası da benzeri de marka sorunudur.
      Burada kendi çizdiğimiz konuşma balonu ve içinde bir gönderme oku var; "hangi uygulamaya"

  <div id="loading" class="modal" hidden>
    <!-- Bekleme görseli yapılan işe göre seçilir: app.js kapsayıcıya load-cad · load-doc · load-out ·
         load-d3 · load-cloud sınıflarından birini koyar, CSS ötekileri kapatır. Sınıf yoksa aşağıdaki
         klasik .spinner görünür. Görseller süstür, anlam taşımaz — okuyucu #loadingText'i okur. -->
    <div class="loadart" aria-hidden="true">

      <!-- 1) cad — AŞAMALI açılış görseli. Ötekilerden farkı şudur: bu görsel bir döngü
           değil, GERÇEK İLERLEMENİN resmidir. app.js yüzdeye göre #loading'e data-cad="0..4"
           koyar (0 dosya · 1 katmanlar · 2 geometri · 3 plan · 4 bitti) ve aşamanın kendi
           içindeki oranı --t değişkeniyle verir. Böylece görsel "çalışıyor" demez, NEREDE
           OLDUĞUNU söyler. Sürekli dönen tek şey nabız ile tarama çizgisidir. -->
      <svg class="la la-cad" viewBox="0 0 120 120" focusable="false">
        <circle class="halo" cx="60" cy="60" r="52"/>
        <circle class="rim"  cx="60" cy="60" r="42"/>

        <!-- 0) dosya açılıyor / okunuyor: kıvrık köşeli pafta, üstünde tarayan ışık -->
        <g class="st s0">
          <path class="sheet" d="M47 32 H68 L80 44 V88 H40 V40 Z"/>
          <path class="fold"  d="M68 32 V44 H80"/>
          <path class="ln"    d="M47 55 H73 M47 62 H73 M47 69 H66"/>
          <rect class="badge" x="40" y="75" width="40" height="11" rx="3"/>
          <path class="tick"  d="M46 80.5 H52 M56 80.5 H62 M66 80.5 H72"/>
          <path class="scan"  d="M34 32 H86"/>
        </g>

        <!-- 1) katmanlar: dört eşkenar levha, --t ile açılır -->
        <g class="st s1">
          <path class="ply" d="M32 40 L60 33 L88 40 L60 47 Z"/>
          <path class="ply" d="M30 53 L60 46 L90 53 L60 60 Z"/>
          <path class="ply" d="M28 66 L60 59 L92 66 L60 73 Z"/>
          <path class="ply on" d="M26 79 L60 72 L94 79 L60 86 Z"/>
        </g>

        <!-- 2) geometri: taban + eksen sabit, dikmeler ve çatı --t ile yükselir -->
        <g class="st s2">
          <path class="base" d="M26 82 H94"/>
          <path class="axis" d="M60 52 V90"/>
          <g class="rise">
            <path class="col" d="M26 82 V53 M43 82 V38 M60 82 V47 M77 82 V32 M94 82 V44"/>
            <path class="roof" d="M26 53 L60 47 L94 44"/>
          </g>
        </g>

        <!-- 3) plan: önce dış duvar ile orta bölme TEK KALEM DARBESİYLE (bir Euler yolu —
             hiçbir duvar iki kez geçilmez), sonra iki iç bölme, en sonda kırpma imleri.
             Kesikli çizgi SVG'de her alt yolda yeniden başlar; bu yüzden sıra, tek bir yola
             yığmakla değil, katmanların --t içindeki payını kaydırmakla kurulur. -->
        <g class="st s3">
          <path class="w1" pathLength="100" d="M24 60 V87 H96 V33 H24 V60 H96"/>
          <path class="w2" pathLength="100" d="M50 33 V60 M73 60 V87"/>
          <path class="crop" d="M18 27 H32 M18 27 V41 M102 93 H88 M102 93 V79"/>
        </g>

        <!-- 4) bitti: nabızlı halka ve onay imi -->
        <g class="st s4">
          <circle class="okhalo" cx="60" cy="60" r="34"/>
          <circle class="okring" cx="60" cy="60" r="27"/>
          <path class="okmark" pathLength="100" d="M47 60 L56 69 L76 47"/>
        </g>
      </svg>

      <!-- 2) doc — çok sayfalı belge dizgisi. .mir sarmalayıcısının kendi animasyonu yoktur;
           RTL'de yalnız o çevrilir, kıvrık köşe sol üste geçer. -->
      <svg class="la la-doc" viewBox="0 0 120 120" focusable="false">
        <g class="mir">
          <rect class="back" x="32" y="18" width="56" height="80" rx="3"/>
          <path class="page" d="M26 20 H74 L94 40 V104 H26 Z"/>
          <path class="fold" d="M74 20 L94 40 H74 Z"/>
          <rect class="ln ln1" x="36" y="54" width="44" height="3.6" rx="1.8"/>
          <rect class="ln ln2" x="36" y="64" width="48" height="3.6" rx="1.8"/>
          <rect class="ln ln3" x="36" y="74" width="40" height="3.6" rx="1.8"/>
          <rect class="ln ln4" x="36" y="84" width="46" height="3.6" rx="1.8"/>
          <rect class="ln ln5" x="36" y="94" width="28" height="3.6" rx="1.8"/>
        </g>
      </svg>

      <!-- 3) out — dışa aktarma / yazdırma. İki özdeş sayfa aynı yolu yarım döngü faz farkıyla
           yürür, akış kesilmez; laOutClip yarığın üstünü açar, cihaz gövdesi opaktır. -->
      <svg class="la la-out" viewBox="0 0 120 120" focusable="false">
        <defs>
          <clipPath id="laOutClip"><rect x="0" y="0" width="120" height="77"/></clipPath>
        </defs>
        <g clip-path="url(#laOutClip)">
          <g class="sh sh1">
            <rect class="pg" x="35" y="10" width="50" height="66" rx="2"/>
            <path class="tr" d="M42 22 H74 M42 30 H66 M42 38 H70"/>
            <rect class="tr2" x="42" y="46" width="26" height="20"/>
            <circle class="tr2" cx="74" cy="58" r="5"/>
          </g>
          <g class="sh sh2">
            <rect class="pg" x="35" y="10" width="50" height="66" rx="2"/>
            <path class="tr" d="M42 22 H74 M42 30 H66 M42 38 H70"/>
            <rect class="tr2" x="42" y="46" width="26" height="20"/>
            <circle class="tr2" cx="74" cy="58" r="5"/>
          </g>
        </g>
        <rect class="dev"  x="14" y="68" width="92" height="34" rx="6"/>
        <path class="slot" d="M30 76 H90"/>
        <rect class="led"  x="82" y="88" width="11" height="5" rx="2.5"/>
        <path class="feet" d="M26 102 V108 M94 102 V108"/>
      </svg>

      <!-- 4) d3 — tel kafes küp. Saf CSS 3B: altı yüz dolgusuzdur, arka kenarlar görünür. -->
      <div class="la la-d3">
        <div class="cube3"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>

      <!-- 5) cloud — solda yukarı akan kolon (yükleme), sağda aşağı akan kolon (indirme). -->
      <svg class="la la-cloud" viewBox="0 0 120 120" focusable="false">
        <path class="cloudbody"
              d="M32 66 H88 A14 14 0 0 0 89 38.1 A19 19 0 0 0 55 29 A14 14 0 0 0 33.5 38.4 A14 14 0 0 0 32 66 Z"/>
        <path class="arw" d="M40 80 l6-7 6 7"/>
        <circle class="dot up up1" cx="46" cy="112" r="3.2"/>
        <circle class="dot up up2" cx="46" cy="112" r="3.2"/>
        <circle class="dot up up3" cx="46" cy="112" r="3.2"/>
        <circle class="dot dn dn1" cx="74" cy="72" r="3.2"/>
        <circle class="dot dn dn2" cx="74" cy="72" r="3.2"/>
        <circle class="dot dn dn3" cx="74" cy="72" r="3.2"/>
        <path class="arw" d="M68 105 l6 7 6-7"/>
      </svg>

    </div>
    <div class="spinner"></div>
    <!-- Açılan dosyanın adı görselin ÜSTÜNDE durur; başlık ile alt başlık aşamayı anlatır,
         böylece "ne açılıyor" ile "şu an ne yapılıyor" birbirine karışmaz. -->
    <div id="loadingFile" class="lfile" hidden></div>

         işçinin bildirdiği oran). Ölçülemeyen aşamalarda (LibreDWG çözümlemesi) çubuk gizlenir ve dönen

    <div id="loadingProg" class="lprog" hidden>

    <div id="loadingDots" class="ldots" aria-hidden="true" hidden><i></i><i></i><i></i><i></i></div>
