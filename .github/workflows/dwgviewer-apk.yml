name: DWG Görüntüleyici APK

on:
  push:
    paths:
      - "DwgViewer/**"
      - ".github/workflows/dwgviewer-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DwgViewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: APK derle (imzalı release)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/release/app-release.apk DwgGoruntuleyici.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DwgGoruntuleyici-apk
          path: DwgViewer/DwgGoruntuleyici.apk
          if-no-files-found: error
