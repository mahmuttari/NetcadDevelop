name: DWG Görüntüleyici APK

on:
  push:
    # yalnız tags yazılırsa dal push'ları tetiklemez; ikisi de açıkça sayılır
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "DwgViewer/**"
      - ".github/workflows/dwgviewer-apk.yml"
  workflow_dispatch:

# Aynı dal/etiket için eski koşu iptal edilir
concurrency:
  group: dwgviewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # etiketli push'ta Release'e APK yüklemek için
    # defaults.run yalnız `run` adımlarını etkiler; actions'ların `path` girdileri depo köküne göredir
    defaults:
      run:
        working-directory: DwgViewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Sürüm eşitliği (build.gradle ↔ version.json ↔ README)
        run: node tools/release_check.mjs --no-apk

      - name: Tarayıcısız sınama (proxy grafikleri)
        run: node tools/test_proxy.mjs

      # İmza anahtarı depoda durmaz; base64'ü bir secret'ta tutulur ve yalnız derleme sırasında diske yazılır.
      # Secret yoksa derleme sürer ama çıktı İMZASIZ olur ve sonraki adım bunu açıkça söyler.
      - name: İmza anahtarını secret'tan yaz
        id: imza
        env:
          KS_B64: ${{ secrets.DWG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::DWG_KEYSTORE_BASE64 secret'ı yok — release İMZASIZ derlenecek"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KS_B64" | base64 -d > keystore/dwgviewer-upload.jks
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: APK ve AAB derle (release)
        env:
          DWG_KEYSTORE: keystore/dwgviewer-upload.jks
          DWG_KEYSTORE_PASSWORD: ${{ secrets.DWG_KEYSTORE_PASSWORD }}
          DWG_KEY_ALIAS: dwgviewer-upload
          DWG_KEY_PASSWORD: ${{ secrets.DWG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --console=plain

      # Beklenen paket adı ve etiket burada elle yazılmaz: release_check.mjs'deki tek tanım kullanılır.
      # (Uygulama v7.9'da "DWG OfficeZip" adını aldı; burada kopyalanmış eski etiket adım başarısızlığına yol açmıştı.)
      # Derlenen APK'nın badging bilgisi build.gradle ile, gömülü assets/viewer dosyaları da kaynakla bayt bayt karşılaştırılır.
      # İmzasız derlemede dosya adı app-release-unsigned.apk olur; hangisi üretildiyse o denetlenir.
      - name: APK sürümü, paket adı ve etiketi build.gradle ile aynı mı
        run: |
          apk=$(ls app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk 2>/dev/null | head -1)
          if [ -z "$apk" ]; then echo "release APK üretilmedi"; exit 1; fi
          echo "denetlenen: $apk"
          node tools/release_check.mjs --apk "$apk"

      - name: Çıktıları adlandır
        run: |
          apk=$(ls app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk 2>/dev/null | head -1)
          cp "$apk" DwgGoruntuleyici.apk
          cp app/build/outputs/bundle/release/app-release.aab DwgGoruntuleyici.aab
          case "$apk" in *unsigned*) echo "::warning::Çıktı İMZASIZ — Play'e yüklenemez, cihaza kurulamaz" ;; esac

      - uses: actions/upload-artifact@v4
        with:
          name: DwgGoruntuleyici-apk
          path: DwgViewer/DwgGoruntuleyici.apk
          if-no-files-found: error

      # Play Console APK değil AAB ister; imzalı bundle buradan indirilip Play'e yüklenir.
      - uses: actions/upload-artifact@v4
        with:
          name: DwgGoruntuleyici-aab
          path: DwgViewer/DwgGoruntuleyici.aab
          if-no-files-found: error

      - name: Release'e yükle (yalnız v* etiketi)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DwgViewer/DwgGoruntuleyici.apk
            DwgViewer/DwgGoruntuleyici.aab
